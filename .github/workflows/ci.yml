name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-cli/go.mod
          cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/
          retention-days: 7
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-cli/go.mod
          cache: false
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y openbox x11-utils
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash scripts/test-linux-desktop.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results
          path: test-results/
          retention-days: 7
