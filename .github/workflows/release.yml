name: Release Desktop
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Branch for build-only, or existing stable tag for publishing
        required: true
        type: string
        default: main
      publish:
        description: Publish as Latest after all targets pass (requires version tag)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-desktop
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: windows-latest, platform: win, arch: arm64 }
          - { os: macos-15, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-cli/go.mod
          cache: false
      - name: Validate version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: node -e "const p=require('./package.json'); if(!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(p.version) || (process.env.PUBLISH_RELEASE === 'true' && process.env.RELEASE_TAG !== 'v'+p.version)) process.exit(1)"
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run test:agent
      - run: npm run build
      - name: Install Linux window manager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openbox x11-utils
      - name: Desktop tests (Linux)
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash scripts/test-linux-desktop.sh
      - name: Desktop tests (Windows and macOS)
        timeout-minutes: 10
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Package target architecture
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
          retention-days: 14
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - name: Publish only the complete six-target release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-manifest.mjs
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "ChatGPT Web Client $RELEASE_TAG" --notes-file "docs/RELEASE-$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
